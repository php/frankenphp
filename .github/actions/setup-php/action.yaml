name: setup-php
description: Setup PHP in ZTS + debug mode with FrankenPHP's standard configuration
inputs:
  php-version:
    description: PHP version (e.g. "8.6")
    required: false
    default: "8.6"
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        ini-file: development
        # JIT's fixed-address mappings can race Go thread creation during startup.
        ini-values: opcache.jit=disable
        # TODO: remove once https://github.com/php/php-src/issues/25412 is fixed
        extensions: :enchant
        coverage: none
        tools: none
      env:
        phpts: ts
        debug: true
