name: setup-go
description: Setup the latest Go patch release, with standard cache configuration
inputs:
  working-directory:
    description: Path prefix for go.sum files (used when the repo is checked out into a subdirectory)
    required: false
    default: "."
  cache:
    description: Whether to cache Go modules and build outputs
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # The go directive of go.mod is a minimum, not the version to build with
        go-version: "1.27"
        cache-dependency-path: |
          ${{ inputs.working-directory }}/go.sum
          ${{ inputs.working-directory }}/caddy/go.sum
        cache: ${{ inputs.cache == 'true' && !startsWith(github.ref, 'refs/tags/') }}
        check-latest: true
